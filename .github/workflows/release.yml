name: Release

# Publishes wheels + sdist to PyPI on a version tag, using PyPI Trusted
# Publishing (OIDC) — no API tokens stored in the repo.
#
# One-time setup on PyPI: create the "panelkit" project's trusted publisher
# pointing at this repo + the "pypi" environment, then push a tag like v0.1.0.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # Run JS-based actions on Node 24 (silences the Node-20 deprecation warnings).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Fail fast (before building anything) if a tag push doesn't match the version
  # declared in the manifests. PyPI versions are immutable, so a mismatched or
  # stale tag would otherwise publish the wrong version — exactly the failure
  # mode where a bump lagged behind the code. On workflow_dispatch (no tag) this
  # just reports the manifest version and passes.
  check-version:
    name: Tag ↔ version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the tag matches pyproject.toml and Cargo.toml
        run: |
          set -euo pipefail
          py_ver=$(grep -m1 -E '^version = ' pyproject.toml | cut -d'"' -f2)
          cargo_ver=$(grep -m1 -E '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "pyproject version : $py_ver"
          echo "Cargo.toml version: $cargo_ver"
          if [ "$py_ver" != "$cargo_ver" ]; then
            echo "::error::pyproject.toml ($py_ver) and Cargo.toml ($cargo_ver) versions disagree."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag_ver="${GITHUB_REF_NAME#v}"
            echo "git tag           : ${GITHUB_REF_NAME} (-> $tag_ver)"
            if [ "$tag_ver" != "$py_ver" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match manifest version $py_ver. Bump the manifests or retag."
              exit 1
            fi
            echo "Tag matches the manifest version — OK to publish $py_ver."
          else
            echo "Not a tag push (workflow_dispatch); skipping tag comparison."
          fi

  build-wheels:
    name: Wheels (${{ matrix.os }} ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Guard against runner-queue stalls (a retired image can queue for 24 h).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest   # Linux x86-64 (manylinux)
            target: x86_64
          - os: ubuntu-latest   # Linux ARM64 (manylinux, cross-compiled)
            target: aarch64
          - os: macos-latest    # macOS Intel, cross-compiled from the ARM
            target: x86_64      # runner (GitHub retired the macos-13 image)
          - os: macos-latest    # macOS Apple Silicon
            target: aarch64
          - os: windows-latest  # Windows x64
            target: x64
    steps:
      - uses: actions/checkout@v4
      - name: Build abi3 wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          command: build
          args: --release --manifest-path crates/pypanelkit/Cargo.toml --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  build-sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path crates/pypanelkit/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  # Validate the built artifacts' metadata before publishing. twine check on the
  # actual wheel + sdist catches metadata regressions (bad long-description,
  # malformed fields) here, where they're recoverable, rather than at the
  # immutable PyPI upload.
  validate:
    name: Validate artifacts (twine check)
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: twine check
        run: |
          python -m pip install --upgrade pip twine
          ls -l dist
          twine check dist/*

  publish:
    name: Publish to PyPI
    needs: [check-version, validate]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Attach wheels + sdist to the GitHub Release
    needs: [build-wheels, build-sdist]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create/update the GitHub Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Create the release with auto-generated notes if it doesn't exist yet,
          # otherwise just (re)upload the built artifacts onto the existing one.
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --generate-notes \
          || gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
